}
const code=(new URLSearchParams(location.search).get('c')||'').replace(/[^a-z0-9]/g,'').slice(0,30);
let L=LG(ls.get('tvp_mc_lang'))?ls.get('tvp_mc_lang'):langueAuto();
let info=null,msgs=[],pend=[],tradInfo={},tradEnCours='';
const t=k=>(T[TK(L)]||T.en)[k]||T.en[k];

function appliquerLangue(){
  document.documentElement.lang=TR(L);document.documentElement.dir=L==='ar'?'rtl':'ltr';
  $('bLang').textContent='🌍 '+LG(L)[1];$('loadT').textContent=t('load');
  $('txt').placeholder=t('ph');
  ['ride','drv','meet','chat'].forEach(k=>{$('t'+k[0].toUpperCase()+k.slice(1)).textContent=t(k)});
  $('chatHint').textContent=t('hint');$('tCall').textContent=t('call');$('tMap').textContent=t('map');$('tLang').textContent='🌍 '+t('lang');
  $('finT').textContent=t('fin');$('finS').textContent=t('finS');
  if(info)rendre();
}
$('bLang').onclick=()=>{
  $('grid').innerHTML=LANGS.map(l=>`<button data-l="${l[0]}" class="${l[0]===L?'on':''}">${esc(l[1])}</button>`).join('');
  $('grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{L=b.dataset.l;ls.set('tvp_mc_lang',L);$('sheet').hidden=true;appliquerLangue();envoyerLangue()});
  $('sheet').hidden=false;
};
$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').hidden=true};

async function api(body){
  const idToken=await auth.currentUser.getIdToken();
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
  try{const r=await fetch(API,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,action:'course',idToken,code})}).then(x=>x.json());if(!r.ok)throw new Error(r.error||'erreur');return r}
  finally{clearTimeout(to)}
}
let langEnvoyee='';
async function envoyerLangue(){if(!info||langEnvoyee===L)return;langEnvoyee=L;try{await setDoc(doc(db,'trad_g',code),{langue:L,t:serverTimestamp()},{merge:true})}catch(e){}}

const fmtDate=(d,h)=>{const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return h||'';
  const dt=new Date(+m[1],+m[2]-1,+m[3]);let s=dt.toLocaleDateString(TR(L),{weekday:'long',day:'numeric',month:'long'});s=s.charAt(0).toUpperCase()+s.slice(1);
  if(h){const [hh,mm]=h.split(':');const x=new Date(+m[1],+m[2]-1,+m[3],+hh,+mm||0);s+=' · '+x.toLocaleTimeString(TR(L),{hour:'2-digit',minute:'2-digit'})}return s};

async function traduireInfo(){
  const tr=TR(L);if(tr==='fr'||!info)return;
  const textes=[info.rdv&&info.rdv.texte,info.vehicule&&info.vehicule.modele].map(x=>String(x||''));
  const cle=tr+'|'+textes.join('|');if(tradInfo[cle]||tradEnCours===cle)return;tradEnCours=cle;
  try{const r=await api({textes,de:'fr',vers:tr,push:false});tradInfo[cle]=r.traductions;rendre()}catch(e){}finally{tradEnCours=''}
}
function rendre(){
  const c=info.course||{},ch=info.chauffeur||{},v=info.vehicule||{},rdv=info.rdv||{};
  const tr=TR(L),cle=tr+'|'+[rdv.texte,v.modele].map(x=>String(x||'')).join('|'),ti=tr==='fr'?[rdv.texte,v.modele]:tradInfo[cle];
  if(tr!=='fr'&&!ti)traduireInfo();
  const prenom=String(c.nom||'').trim();
  $('hello').textContent=prenom?t('hello').replace('{n}',prenom):t('hello0');$('helloS').textContent=t('helloS');
  $('when').textContent=fmtDate(c.date,c.heure);
  $('route').innerHTML=`<i><span class="dot"></span></i><div><small>${esc(t('from'))}</small>${esc(c.dep||'—')}</div><i><span class="ln"></span></i><div></div><i><span class="dot f"></span></i><div><small>${esc(t('to'))}</small>${esc(c.arr||'—')}</div>`;
  $('chips').innerHTML=[c.pax&&`👥 ${esc(c.pax)} ${esc(t('pax'))}`,+c.bagages>0&&`🧳 ${esc(c.bagages)} ${esc(t('bags'))}`,c.vol&&`✈️ ${esc(t('flight'))} ${esc(c.vol)}`].filter(Boolean).map(x=>`<span class="chip">${x}</span>`).join('');
  // chauffeur
  const pn=String(ch.prenom||'').trim();
  $('av').textContent=pn?pn[0].toUpperCase():'🚖';$('drvN').textContent=pn||t('drv0');
  $('drvV').textContent=(ti?ti[1]:v.modele)||v.modele||'';
  $('plate').hidden=!v.plaque;$('plateT').textContent=String(v.plaque||'').toUpperCase();
  const tel=String(ch.tel||'+33667402005').replace(/[^\d+]/g,''),wa=tel.replace(/^\+/,'').replace(/^0/,'33');
  $('bCall').href='tel:'+tel;$('bWa').href='https://wa.me/'+wa;$('finWa').href='https://wa.me/'+wa;
  // rendez-vous
  $('cMeet').hidden=!rdv.texte;
  $('meet').textContent=ti?(ti[0]||rdv.texte||''):(rdv.texte||'');
  $('bOrig').hidden=tr==='fr'||!rdv.texte;$('bOrig').textContent=t('orig');$('origT').textContent=rdv.texte||'';
  const lieu=rdv.lieu||c.dep;$('mapActs').hidden=!lieu;$('bMap').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(lieu||'');
  dessiner();
}
$('bOrig').onclick=()=>{$('origT').hidden=!$('origT').hidden};

const hm=ms=>ms?new Date(ms).toLocaleTimeString(TR(L),{hour:'2-digit',minute:'2-digit'}):'';
function dessiner(){
  const liste=msgs.concat(pend);
  if(!liste.length){$('msgs').innerHTML=`<div class="empty">${esc(t('empty'))}</div>`;return}
  $('msgs').innerHTML=liste.map(m=>{
    const moi=m.de==='client';const txt=moi?m.texte:(m.traduction||m.texte);
    return `<div class="bub ${moi?'me':''} ${m.pend?'pend':''}">${esc(txt)}<div class="tm">${m.pend?'…':hm(tsMs(m.t))}${moi&&!m.pend?' ✓':''}</div></div>`;
  }).join('');
}
function finir(){$('app').hidden=true;$('dock').hidden=true;$('load').hidden=true;$('fin').hidden=false}

$('fSend').onsubmit=async e=>{
  e.preventDefault();const texte=$('txt').value.trim().slice(0,600);if(!texte)return;$('txt').value='';
  const p={de:'client',texte,pend:true,t:null};pend.push(p);dessiner();scrollBas();
  let trad=null;const src=TR(L);
  // langue détectée automatiquement : un client réglé en anglais qui écrit en français arrive bien en français
  try{const r=await api({textes:[texte],de:'',vers:'fr',push:true,nom:(info.course||{}).nom||''});trad=r.traductions[0]||null}catch(e){}
  try{await addDoc(collection(db,'trad_g',code,'msgs'),{de:'client',texte,langue:src,traduction:trad,langueT:'fr',t:serverTimestamp()})}
  catch(e){toast(t('err'));$('txt').value=texte}
  pend=pend.filter(x=>x!==p);dessiner();
};
const scrollBas=()=>setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60);

appliquerLangue();
if(!code){finir()}
else{
  onAuthStateChanged(auth,u=>{
    if(!u){signInAnonymously(auth).catch(()=>finir());return}
    onSnapshot(doc(db,'trad_codes',code),s=>{const d=s.exists()?s.data():null;if(!d||!d.actif||tsMs(d.exp)<Date.now())finir()},()=>finir());
    onSnapshot(doc(db,'trad_g',code),s=>{
      if(!s.exists()){finir();return}
      info=s.data();$('load').hidden=true;$('app').hidden=false;$('dock').hidden=false;rendre();envoyerLangue();
    },()=>finir());
    let premier=true;
    onSnapshot(query(collection(db,'trad_g',code,'msgs'),orderBy('t','desc'),limit(80)),s=>{
      const n=msgs.length;msgs=s.docs.map(d=>({id:d.id,...d.data()})).reverse();dessiner();
      if(!premier&&msgs.length>n&&msgs[msgs.length-1].de!=='client'){scrollBas();try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}
      premier=false;
    },()=>{});
  });
}
</script>
</body>
</html>
