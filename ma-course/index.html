async function api(body){

  try{const r=await fetch(API,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,action:'course',idToken,code})}).then(x=>x.json());if(!r.ok)throw new Error(r.error||'erreur');return r}

}

const hm=ms=>ms?new Date(ms).toLocaleTimeString(TR(L),{hour:'2-digit',minute:'2-digit'}):'';

function vuPar(){const v=info&&info['vu_'+AUTRE()];return tsMs(v)}
function dessiner(){
  const liste=msgs.concat(pend);
  const vu=vuPar(),dernierMien=[...msgs].reverse().find(m=>(CHAUF?m.de!=='client':m.de==='client')&&!m.type);
  if(!liste.length){$('msgs').innerHTML=`<div class="empty">${esc(t('empty'))}</div>`;return}
  $('msgs').innerHTML=liste.map(m=>{
    if(CHAUF){const moi=m.de!=='client';const qui=m.de==='client'?'👤 Client':(m.par==='chauffeur'?'Moi':'🏢 Taxis Van Paris');
      const txt=moi?m.texte:(m.traduction||m.texte);const orig=!moi&&m.langue&&m.langue!=='fr'&&m.texte!==txt?`<div class="tm" style="text-align:left">🌍 ${esc(m.texte)}</div>`:'';
      const lu=moi&&m===dernierMien&&vu&&vu>=tsMs(m.t);
      return `<div class="bub ${moi?'me':''} ${m.pend?'pend':''}"><div class="tm" style="text-align:left;margin:0 0 3px">${qui}</div>${esc(txt)}${orig}<div class="tm">${m.pend?'…':hm(tsMs(m.t))}${lu?' <span class="vu">✓✓ Vu</span>':''}</div></div>`;}
    const moi=m.de==='client';const txt=moi?m.texte:(m.traduction||m.texte);
    const lu=moi&&m===dernierMien&&vu&&vu>=tsMs(m.t);
    return `<div class="bub ${moi?'me':''} ${m.pend?'pend':''}">${esc(txt)}<div class="tm">${m.pend?'…':hm(tsMs(m.t))}${moi&&!m.pend?(lu?` <span class="vu">✓✓ ${esc(ct('seen'))}</span>`:' ✓'):''}</div></div>`;
  }).join('');
}

$('fSend').onsubmit=async e=>{
  e.preventDefault();const texte=$('txt').value.trim().slice(0,600);if(!texte)return;$('txt').value='';
  if(CHAUF){
    const p={de:'chauffeur',par:'chauffeur',texte,pend:true,t:null};pend.push(p);dessiner();scrollBas();

    try{await addDoc(collection(db,'trad_g',code,'msgs'),{de:'chauffeur',par:'chauffeur',texte,langue:'fr',traduction:trad||texte,langueT:vers,t:serverTimestamp()})}

  }

  let trad=null;const src=TR(L);
  // langue détectée automatiquement : un client réglé en anglais qui écrit en français arrive bien en français
  let lg=src;

  try{await addDoc(collection(db,'trad_g',code,'msgs'),{de:'client',texte,langue:lg,traduction:trad,langueT:'fr',t:serverTimestamp()})}
  catch(e){toast(t('err'));$('txt').value=texte}

};

/* ===== Appel internet masqué : WebRTC pair-à-pair, signalisation dans trad_g/{code}/appels ===== */
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},
  {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]};
let pc=null,flux=null,appel=null,unsC=[],debut=0,tSonne=null,muet=false;
const ctxT=k=>CHAUF?CT.fr[k]:ct(k);
function ov(mode,titre,sous){$('callov').hidden=false;$('cT').textContent=titre;$('cS').textContent=sous;$('cRing').hidden=mode!=='ring';$('cLive').hidden=mode==='ring';$('cMuteL').textContent=ctxT('mute');$('cHangL').textContent=ctxT('hang')}
function nettoyer(){unsC.forEach(f=>{try{f()}catch(e){}});unsC=[];if(pc){try{pc.close()}catch(e){}pc=null}if(flux){flux.getTracks().forEach(t=>t.stop());flux=null}clearTimeout(tSonne);$('callov').hidden=true;$('rAudio').srcObject=null;muet=false;$('cMute').classList.remove('on')}
async function micro(){try{return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast(ctxT('mic'));throw e}}
function brancher(id,cote){
  pc=new RTCPeerConnection(ICE);flux.getTracks().forEach(t=>pc.addTrack(t,flux));
  pc.ontrack=e=>{$('rAudio').srcObject=e.streams[0];$('rAudio').play().catch(()=>{})};
  pc.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,'trad_g',code,'appels',id,'ice_'+cote),e.candidate.toJSON()).catch(()=>{})};
  pc.onconnectionstatechange=()=>{if(pc&&pc.connectionState==='connected'){debut=Date.now();ov('live',ctxT('live'),ctxT('outS'))}if(pc&&['failed','closed'].includes(pc.connectionState))raccrocher(false)};
  const autre=cote==='a'?'b':'a';
  unsC.push(onSnapshot(collection(db,'trad_g',code,'appels',id,'ice_'+autre),s=>s.docChanges().forEach(c=>{if(c.type==='added'&&pc)pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(()=>{})})));
}
async function appeler(){
  if(appel)return;
  try{flux=await micro()}catch(e){return}
  const ref=await addDoc(collection(db,'trad_g',code,'appels'),{de:MOI(),etat:'sonne',t:serverTimestamp()});
  appel={id:ref.id,moi:'a'};brancher(ref.id,'a');
  const off=await pc.createOffer();await pc.setLocalDescription(off);
  await updateDoc(ref,{offer:{type:off.type,sdp:off.sdp}});
  ov('live',ctxT('out'),ctxT('outS'));
  unsC.push(onSnapshot(ref,async s=>{const d=s.data()||{};
    if(d.answer&&pc&&!pc.currentRemoteDescription)await pc.setRemoteDescription(d.answer);
    if(d.etat==='fini'||d.etat==='refuse'){if(d.etat==='refuse')toast(ctxT('busy'));raccrocher(false)}}));
  tSonne=setTimeout(async()=>{if(!debut&&appel){await updateDoc(ref,{etat:'manque'}).catch(()=>{});journal('miss');toast(ctxT('busy'));nettoyer();appel=null}},35000);
}
async function decrocher(){
  if(!appel||appel.moi!=='b')return;
  try{flux=await micro()}catch(e){return}
  const ref=doc(db,'trad_g',code,'appels',appel.id);brancher(appel.id,'b');
  await pc.setRemoteDescription(appel.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
  await updateDoc(ref,{answer:{type:ans.type,sdp:ans.sdp},etat:'en_cours'});
  ov('live',ctxT('live'),ctxT('outS'));
  unsC.push(onSnapshot(ref,s=>{const d=s.data()||{};if(d.etat==='fini')raccrocher(false)}));
}
async function raccrocher(signaler=true){
  if(!appel)return nettoyer();
  const id=appel.id,duree=debut?Math.round((Date.now()-debut)/1000):0,lanceur=appel.moi==='a';
  if(signaler)await updateDoc(doc(db,'trad_g',code,'appels',id),{etat:appel.moi==='b'&&!debut?'refuse':'fini',duree}).catch(()=>{});
  if(lanceur&&duree)journal('done',duree);
  appel=null;debut=0;nettoyer();
}
function journal(type,duree){
  const d=type==='miss'?'':' · '+Math.floor(duree/60)+' min '+String(duree%60).padStart(2,'0');
  const fr=(type==='miss'?CT.fr.miss:CT.fr.done)+d, loc=(type==='miss'?ct('miss'):ct('done'))+d;
  // texte = langue de celui qui écrit ; traduction = langue de l'autre (le français pour le chauffeur et Badr)
  addDoc(collection(db,'trad_g',code,'msgs'),CHAUF?{de:'chauffeur',par:'chauffeur',type:'appel',texte:fr,traduction:loc,langue:'fr',t:serverTimestamp()}
    :{de:'client',type:'appel',texte:loc,traduction:fr,langue:TR(L),t:serverTimestamp()}).catch(()=>{});
}
function ecouterAppels(){
  onSnapshot(query(collection(db,'trad_g',code,'appels'),orderBy('t','desc'),limit(1)),s=>{
    const d0=s.docs[0];if(!d0)return;const d={id:d0.id,...d0.data()};
    const recent=Date.now()-tsMs(d.t)<40000;
    if(d.etat==='sonne'&&d.de!==MOI()&&d.offer&&recent&&!appel){
      appel={id:d.id,moi:'b',offer:d.offer};
      ov('ring',ctxT('inc'),CHAUF?CT.fr.incD:ct('incC'));
      try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400])}catch(e){}
    }
    if(appel&&appel.moi==='b'&&d.id===appel.id&&['manque','fini'].includes(d.etat)&&!debut){appel=null;nettoyer()}
  },()=>{});
}
$('bAppel').onclick=()=>appeler().catch(e=>{nettoyer();appel=null;toast(e&&e.code==='permission-denied'?(CHAUF?'Appel bloqué : règle Firebase à ajouter':'Call not available yet, please write a message'):(CHAUF?'Appel impossible, réessaie':'Call failed, please try again'))});$('cAccept').onclick=decrocher;$('cRefuse').onclick=()=>raccrocher(true);$('cHang').onclick=()=>raccrocher(true);
$('cMute').onclick=()=>{if(!flux)return;muet=!muet;flux.getAudioTracks().forEach(t=>t.enabled=!muet);$('cMute').classList.toggle('on',muet)};
window.addEventListener('pagehide',()=>{if(appel)raccrocher(true)});

appliquerLangue();
if(CHAUF){
  document.title='Taxis Van Paris – Chat client';
  $('bLang').hidden=true;$('cDrv').hidden=true;
  const st=document.createElement('style');st.textContent='#hello{font-size:22px}.wrap{padding-bottom:calc(170px + var(--bot))}';document.head.appendChild(st);
  const fixe=()=>{$('hello').textContent='💬 Conversation avec le client';$('helloS').textContent='🔒 Le numéro du client est masqué. Écris en français : ton message part traduit dans sa langue.';
    $('tChat').textContent='Messages';$('chatHint').textContent='Les messages du client arrivent traduits en français (original en dessous).';$('txt').placeholder='Écrire au client…'};
  const r0=rendre;rendre=function(){r0();fixe()};fixe();
  const Q=['Je suis arrivé, je vous attends 👋','Je suis à la sortie… ','J\'arrive dans 5 minutes','Votre vol a atterri, prenez votre temps','Je ne vous trouve pas, où êtes-vous ?','Je suis devant, voiture noire'];
  $('quick').innerHTML=Q.map(q=>`<button type="button">${esc(q)}</button>`).join('');$('quick').hidden=false;
  $('quick').querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.textContent;if(/…\s*$/.test(v)){$('txt').value=v.replace(/…\s*$/,'');$('txt').focus()}else{$('txt').value=v;$('fSend').requestSubmit()}});
}
if(!code){finir()}
else{
  onAuthStateChanged(auth,u=>{
    if(!u){signInAnonymously(auth).catch(()=>finir());return}
    onSnapshot(doc(db,'trad_codes',code),s=>{const d=s.exists()?s.data():null;if(!d||!d.actif||tsMs(d.exp)<Date.now())finir()},()=>finir());
    onSnapshot(doc(db,'trad_g',code),s=>{
      if(!s.exists()){finir();return}
      info=s.data();
      {const c=info.course||{},m=String(c.date||'').match(/^(\d{4})-(\d{2})-(\d{2})$/),h=String(c.heure||'').match(/^(\d{1,2}):(\d{2})/);
       if(m&&h&&Date.now()>new Date(+m[1],+m[2]-1,+m[3],+h[1],+h[2]).getTime()+3*3600e3&&!CHAUF){finir();return}}
      $('load').hidden=true;$('app').hidden=false;$('dock').hidden=false;rendre();envoyerLangue();
    },()=>finir());
    ecouterAppels();
    let premier=true;
    onSnapshot(query(collection(db,'trad_g',code,'msgs'),orderBy('t','desc'),limit(80)),s=>{
      const n=msgs.length;msgs=s.docs.map(d=>({id:d.id,...d.data()})).reverse();dessiner();
      if(!premier&&msgs.length>n&&(CHAUF?msgs[msgs.length-1].de==='client':msgs[msgs.length-1].de!=='client')){scrollBas();try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}
      marquerLu();
      premier=false;
    },()=>{});
  });
}
