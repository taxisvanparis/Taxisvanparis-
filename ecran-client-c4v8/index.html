<style>
:root{--bg:#050505;--card:#141310;--line:#2a261d;--gold:#C9A84C;--gold2:#EBC660;--ink:#F5F1E8;--mut:#A9A08C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
.app{height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 22px calc(14px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:2px solid var(--gold)}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:clamp(22px,3.2vw,34px);letter-spacing:-.01em}
.brand b{color:var(--gold)}
.brand small{display:block;font:600 11px/1 -apple-system,Arial,sans-serif;letter-spacing:.32em;color:var(--gold);margin-top:4px}
.clock{margin-left:auto;text-align:right}
.clock b{display:block;font-size:clamp(22px,3vw,32px);font-weight:800;font-variant-numeric:tabular-nums}
.clock span{color:var(--mut);font-size:13px}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:12px 0 6px}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:15px;cursor:pointer}
.langs button.on{border-color:var(--gold);background:rgba(201,168,76,.18)}
h1{text-align:center;font-family:Georgia,serif;font-weight:900;font-size:clamp(26px,4vw,44px);margin:8px 0 2px}
h1 span{color:var(--gold)}
.sub{text-align:center;color:var(--mut);margin:0 0 14px;font-size:clamp(14px,1.8vw,18px)}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:14px;min-height:0}
.tile{background:linear-gradient(180deg,#1b1914,#100f0c);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s,border-color .12s}
.tile:active{transform:scale(.97);border-color:var(--gold)}
.tile i{font-style:normal;font-size:clamp(34px,5vw,58px);line-height:1}
.tile b{font-size:clamp(15px,2vw,21px)}
.tile small{color:var(--mut);font-size:clamp(12px,1.4vw,14px);line-height:1.3}
.tile.hi{border-color:rgba(201,168,76,.6);background:linear-gradient(180deg,#2a2314,#14110a)}
@media (orientation:portrait){.grid{grid-template-columns:repeat(2,1fr)}}
.ov{position:fixed;inset:0;z-index:20;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.ov[hidden]{display:none}
.ov h2{font-family:Georgia,serif;font-size:clamp(28px,4.4vw,48px);margin:0 0 8px}
.ov p{color:var(--mut);font-size:clamp(16px,2.2vw,22px);margin:0 0 18px;max-width:760px}
.qr{margin:0 auto;background:#fff;border-radius:22px;padding:16px;width:min(46vmin,400px);height:min(46vmin,400px);display:flex;align-items:center;justify-content:center}
.qr svg,.qr img{width:100%;height:100%;display:block}
.big{font-size:clamp(20px,3vw,30px);font-weight:800;margin-top:14px}
.close{position:fixed;right:22px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border:2px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;padding:12px 22px;font-size:18px;font-weight:800;cursor:pointer}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(900px,100%);text-align:left}
.list div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.list b{display:block;font-size:19px}.list span{color:var(--mut);font-size:15px}
.check{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:clamp(40px,7vw,80px);margin:10px 0 20px}
.check div{display:flex;flex-direction:column;align-items:center;gap:6px}.check small{font-size:clamp(14px,1.8vw,20px);color:var(--ink)}
.row{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.cfg label{display:block;text-align:left;color:var(--mut);margin:10px 0 4px}
.cfg input{width:min(420px,80vw);font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#111;color:#fff}
.cfg .go{margin-top:16px;background:var(--gold);color:#050505;border:0;border-radius:12px;padding:12px 22px;font-size:18px;font-weight:800}
.foot{text-align:center;color:#6f6858;font-size:12px;padding-top:8px}
</style>
</head>

const TILES=[['wifi','📶'],['ret','🔁',1],['prix','💶'],['exc','🏰'],['oubli','🧳'],['photo','📸'],['avis','⭐',1],['wa','💬']];
function qr(txt){try{const q=qrcode(0,'M');q.addData(txt);q.make();return q.createSvgTag({cellSize:8,margin:2,scalable:true})}catch(e){return '<div style="color:#000;font-weight:800;word-break:break-all;padding:10px">'+txt+'</div>'}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const t=T[lg];document.documentElement.lang=lg;document.documentElement.dir=lg==='ar'?'rtl':'ltr';
  $('langs').innerHTML=LANGS.map(([k,n])=>`<button data-l="${k}" class="${k===lg?'on':''}">${n}</button>`).join('');
  $('t1').innerHTML=t.t1;$('t2').textContent=t.t2;$('ovClose').textContent=t.close;
  const wifi=store.get('ec-wifi',null);
  $('grid').innerHTML=TILES.filter(([k])=>k!=='wifi'||wifi).map(([k,ic,hi])=>`<button class="tile${hi?' hi':''}" data-k="${k}"><i>${ic}</i><b>${esc(t[k][0])}</b><small>${esc(t[k][1])}</small></button>`).join('');
}
function open(k){
  const t=T[lg],w=store.get('ec-wifi',{s:'',p:''});let h='';
  const page=(title,p,url,extra)=>`<h2>${title}</h2><p>${p}</p><div class="qr">${qr(url)}</div><div class="big">${t.scan}</div>${extra||''}`;
  if(k==='wifi')h=page(t.wifiT,t.wifiP,`WIFI:T:WPA;S:${w.s};P:${w.p};;`,`<p style="margin-top:14px">${t.net} : <b style="color:#fff">${esc(w.s)}</b> · ${t.pass} : <b style="color:#fff">${esc(w.p)}</b></p>`);
  if(k==='ret')h=page(t.retT,t.retP,SITE+'?utm_source=tablette&utm_medium=retour#reserver');
  if(k==='prix')h=page(t.prixT,t.prixP,SITE+'?utm_source=tablette&utm_medium=prix#reserver');
  if(k==='avis')h=page(t.avisT,t.avisP,AVIS);
  if(k==='wa')h=page(t.waT,t.waP,'https://wa.me/'+WA);
  if(k==='exc')h=`<h2>${t.excT}</h2><p>${t.excP}</p><div class="row"><div class="list">${t.exList.map(([a,b])=>`<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div><div class="qr" style="width:min(30vmin,260px);height:min(30vmin,260px)">${qr('https://wa.me/'+WA+'?text='+encodeURIComponent(t.waMsg))}</div></div>`;
  if(k==='oubli')h=`<h2>${t.oubliT}</h2><div class="check">${['📱','🛂','👜','🕶️','🔌'].map((e,i)=>`<div>${e}<small>${esc(t.items[i])}</small></div>`).join('')}</div><p>✓ ${esc(t.items.join(' · '))}</p>`;
  if(k==='photo')h=`<h2>${t.photoT}</h2><div style="font-size:min(30vmin,220px);line-height:1;margin:6px 0 14px">📸</div><p>${t.photoP}</p>`;
  $('ovIn').innerHTML=h;$('ov').hidden=false;clearTimeout(window._ovT);window._ovT=setTimeout(()=>{$('ov').hidden=true},120000);
}
$('langs').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;lg=b.dataset.l;store.set('ec-lang',lg);render()};
$('grid').onclick=e=>{const b=e.target.closest('[data-k]');if(b)open(b.dataset.k)};
$('ovClose').onclick=()=>{$('ov').hidden=true};

// Réglages chauffeur : appui long 3 s sur le logo (nom et mot de passe du Wi-Fi de la voiture)
let lp;$('logo').addEventListener('pointerdown',()=>{lp=setTimeout(()=>{const w=store.get('ec-wifi',{s:'',p:''});
  $('ovIn').innerHTML=`<div class="cfg"><h2>Réglages chauffeur</h2><p>Wi-Fi de la voiture (laisser vide pour masquer l'icône).</p>
  <label>Nom du réseau</label><input id="cS" value="${esc(w.s)}" autocapitalize="off"><label>Mot de passe</label><input id="cP" value="${esc(w.p)}" autocapitalize="off"><br><button class="go" id="cOk">Enregistrer</button></div>`;
  $('ov').hidden=false;$('cOk').onclick=()=>{const s=$('cS').value.trim();store.set('ec-wifi',s?{s:s,p:$('cP').value.trim()}:null);$('ov').hidden=true;render()};},3000)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>$('logo').addEventListener(ev,()=>clearTimeout(lp)));

// Horloge
function tick(){const d=new Date();$('hh').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  $('dd').textContent=d.toLocaleDateString(lg==='zh'?'zh-CN':lg==='ar'?'ar':lg,{weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,15000);

// Écran toujours allumé
let wl=null;async function awake(){try{if('wakeLock' in navigator&&(!wl||wl.released))wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')awake()});document.addEventListener('pointerdown',awake);awake();
render();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</body>
</html>
