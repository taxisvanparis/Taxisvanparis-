<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxis Van Paris — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213A;
    --ink-soft:#233150;
    --gold:#C9974A;
    --gold-soft:#E8D2A6;
    --bg:#F4F5F7;
    --card:#FFFFFF;
    --border:#E3E5EA;
    --text:#1D2433;
    --muted:#6B7280;
    --green:#3F7D58;
    --green-bg:#E7F3EC;
    --amber:#B4791F;
    --amber-bg:#FBF0DD;
    --red:#B23A32;
    --red-bg:#FBEAE8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
  h1,h2,.brand{font-family:'Fraunces',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--ink);
  }
  .login-card{
    background:var(--card);width:100%;max-width:380px;padding:40px 36px;
    border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .login-card .brand{font-size:26px;color:var(--ink);margin:0 0 4px;}
  .login-card .brand-sub{
    display:block;width:36px;height:3px;background:var(--gold);margin:10px 0 24px;
  }
  .login-card p.tag{color:var(--muted);font-size:14px;margin:0 0 28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:15px;background:#FBFBFC;
  }
  .field input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .btn-primary{
    width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:8px;
    font-size:15px;font-weight:600;margin-top:8px;transition:background .15s;
  }
  .btn-primary:hover{background:var(--ink-soft);}
  #login-error{color:var(--red);font-size:13px;margin-top:14px;min-height:16px;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  #app.shown{display:flex;}
  #sidebar{
    width:230px;flex-shrink:0;background:var(--ink);color:#fff;
    display:flex;flex-direction:column;padding:26px 18px;
  }
  #sidebar .brand{color:#fff;font-size:20px;margin:0 0 2px;}
  #sidebar .brand-sub{color:var(--gold-soft);font-size:12px;margin-bottom:32px;display:block;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;
    color:#C7CCDA;text-decoration:none;font-size:14px;margin-bottom:4px;background:none;
    border:none;width:100%;text-align:left;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:rgba(201,151,74,.18);color:#fff;}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:0;}
  .nav-item.active .dot{opacity:1;}
  #sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);}
  #sidebar-footer .who{font-size:13px;color:#C7CCDA;margin-bottom:10px;}
  #sidebar-footer .who strong{color:#fff;display:block;font-size:14px;}
  .btn-logout{
    background:none;border:1px solid rgba(255,255,255,.2);color:#C7CCDA;
    padding:8px 12px;border-radius:7px;font-size:13px;width:100%;
  }
  .btn-logout:hover{border-color:var(--gold);color:#fff;}

  #main-wrap{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{
    padding:20px 32px;background:var(--card);border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  #topbar h1{font-size:22px;margin:0;color:var(--ink);}
  #topbar .topbar-sub{color:var(--muted);font-size:13px;margin-top:2px;}
  #main{padding:28px 32px;flex:1;overflow-y:auto;}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .stats-row{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;flex:1;min-width:160px;
  }
  .stat-card .label{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .stat-card .value{font-size:24px;font-weight:600;color:var(--ink);}

  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .filters{display:flex;gap:8px;}
  .filters select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:13.5px;}
  .btn-gold{
    background:var(--gold);color:#fff;border:none;padding:10px 18px;border-radius:8px;
    font-size:14px;font-weight:600;
  }
  .btn-gold:hover{background:var(--amber);}

  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);}
  thead th{
    text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 14px;
    background:#FAFAFB;border-bottom:1px solid var(--border);
  }
  tbody td{padding:13px 14px;font-size:14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAFB;}
  .empty-row td{text-align:center;color:var(--muted);padding:36px 14px;}

  .badge{
    display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;
  }
  .badge.attente{background:var(--amber-bg);color:var(--amber);}
  .badge.confirmee{background:#E4EBF7;color:#2F5AA8;}
  .badge.terminee{background:var(--green-bg);color:var(--green);}
  .badge.annulee{background:var(--red-bg);color:var(--red);}
  .badge.payee{background:var(--green-bg);color:var(--green);}
  .badge.impayee{background:var(--red-bg);color:var(--red);}
  .badge.dispo{background:var(--green-bg);color:var(--green);}
  .badge.encourse{background:#E4EBF7;color:#2F5AA8;}
  .badge.horsservice{background:#EEE;color:var(--muted);}

  select.statut-select{
    border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:13px;background:#fff;
  }
  .icon-btn{
    background:none;border:none;color:var(--muted);padding:5px 7px;border-radius:6px;font-size:13px;
  }
  .icon-btn:hover{background:#EEE;color:var(--text);}
  .icon-btn.danger:hover{background:var(--red-bg);color:var(--red);}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,25,40,.5);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay.shown{display:flex;}
  .modal{
    background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
    padding:28px 30px;
  }
  .modal h2{font-size:19px;margin:0 0 20px;color:var(--ink);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .btn-ghost{background:none;border:1px solid var(--border);padding:10px 16px;border-radius:8px;font-size:14px;color:var(--muted);}
  .btn-ghost:hover{border-color:var(--muted);}

  /* ---------- DRIVER VIEW ---------- */
  #driver-view{display:none;min-height:100vh;background:var(--bg);}
  #driver-view.shown{display:block;}
  #driver-top{
    background:var(--ink);color:#fff;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;
  }
  #driver-top .who strong{display:block;font-size:16px;}
  #driver-top .who span{font-size:12.5px;color:var(--gold-soft);}
  #driver-list{padding:18px;display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto;}
  .course-card{
    background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;
  }
  .course-card .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .course-card .date-heure{font-weight:600;color:var(--ink);font-size:15px;}
  .route{margin-bottom:12px;}
  .route .stop{display:flex;gap:10
