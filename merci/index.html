<style>
  #tvp-ck{position:fixed;left:12px;right:12px;bottom:12px;z-index:100000;max-width:560px;margin:0 auto;background:#1B1813;color:#F3EDE2;border:1px solid rgba(201,168,76,.5);

<script>
(function(){
  var lg=(document.documentElement.lang||"fr").slice(0,2);
  var T={fr:["🍪 Nous utilisons des cookies de mesure d'audience pour améliorer le site. Vous pouvez les accepter ou les refuser.","Refuser","Accepter"],
         en:["🍪 We use analytics cookies to improve this website. You can accept or decline them.","Decline","Accept"],

  if(!T) T=["🍪 Nous utilisons des cookies de mesure d'audience pour améliorer le site. Vous pouvez les accepter ou les refuser.","Refuser","Accepter"];
  var b=document.getElementById("tvp-ck"); if(!b) return;
  b.querySelector("p").textContent=T[0]; b.querySelector(".r").textContent=T[1]; b.querySelector(".a").textContent=T[2];
  function lire(){ try{ var c=JSON.parse(localStorage.getItem("tvp_consent")||"null"); if(c&&Date.now()-c.t<15552000000) return c.v; }catch(e){} return null; }
  function choisir(v){
    try{ localStorage.setItem("tvp_consent",JSON.stringify({v:v,t:Date.now()})); }catch(e){}
    if(typeof gtag==="function") gtag("consent","update",{ad_storage:v,analytics_storage:v,ad_user_data:v,ad_personalization:v});
    b.classList.remove("on");
  }
  b.querySelector(".a").onclick=function(){ choisir("granted"); };
  b.querySelector(".r").onclick=function(){ choisir("denied"); };
  window.tvpCookies=function(){ b.classList.add("on"); };   // pour rouvrir la bannière
  if(!lire()) setTimeout(function(){ b.classList.add("on"); },600);
})();
</script>
